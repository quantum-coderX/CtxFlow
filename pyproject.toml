[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxflow"
version = "0.2.0"
description = "Schema-agnostic, incrementally-built context graph for LLM agent memory — with ResearchOS multi-agent layer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "networkx>=3.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
nlp = ["spacy>=3.0"]
binary = ["msgpack>=1.0"]
llm = ["openai>=1.0"]
local-embeddings = ["sentence-transformers>=3.0"]
researchos = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "sse-starlette>=2.0",
]
orchestration = ["langgraph>=1.0"]
mcp = ["mcp>=1.0"]
web = ["ddgs>=9.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
]
all = [
    "ctxflow[nlp,binary,llm,local-embeddings,researchos,orchestration,mcp,web,dev]",
    "spacy>=3.0",
    "msgpack>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "sse-starlette>=2.0",
    "langgraph>=1.0",
    "mcp>=1.0",
    "ddgs>=9.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
researchos-api = "researchos.api.main:main"
researchos-eval = "researchos.eval.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ctxflow*", "researchos*"]

[tool.setuptools.package-data]
researchos = ["web/*.html", "web/*.css", "web/*.js", "demo/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "postgres: tests that use the configured real PostgreSQL database",
    "integration: end-to-end memory pipeline integration tests",
    "researchos: tests for the ResearchOS agent/skill layer",
]
